<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weliwel & Majisto Isometric Walk</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-top: #dff6ea;
      --bg-bottom: #8bb890;
      --canvas-edge: rgba(255, 255, 255, 0.12);
      --page-font: "Trebuchet MS", "Aptos", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: var(--page-font);
      background:
        radial-gradient(circle at top, rgba(250, 255, 245, 0.88), rgba(255, 255, 255, 0) 38%),
        linear-gradient(180deg, var(--bg-top) 0%, #bedbb4 34%, var(--bg-bottom) 100%);
      overflow: hidden;
    }

    body {
      overscroll-behavior: none;
    }

    .app-shell {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      opacity: 0;
      transform: translateY(12px);
      animation: settle 560ms ease forwards;
    }

    .scene-shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 30%),
        linear-gradient(180deg, rgba(244, 252, 244, 0.3), rgba(29, 59, 42, 0.12));
      border: 1px solid var(--canvas-edge);
    }

    .scene-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0) 20%, rgba(5, 13, 9, 0.08) 100%);
    }

    #scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    .touch-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .touch-corner,
    .touch-center {
      position: absolute;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 120ms ease, transform 120ms ease, box-shadow 120ms ease;
    }

    .touch-corner {
      width: min(28vw, 28vh);
      height: min(28vw, 28vh);
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0) 72%);
    }

    .touch-corner.top-left {
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
    }

    .touch-corner.top-right {
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
    }

    .touch-corner.bottom-right {
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
    }

    .touch-corner.bottom-left {
      bottom: max(16px, env(safe-area-inset-bottom));
      left: max(16px, env(safe-area-inset-left));
    }

    .touch-center {
      top: 50%;
      left: 50%;
      width: min(30vw, 30vh);
      height: min(30vw, 30vh);
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04) 56%, rgba(255, 255, 255, 0) 72%);
    }

    @media (pointer: coarse) {
      .touch-corner,
      .touch-center {
        opacity: 0.16;
      }
    }

    .scene-shell.is-zone-top-left .touch-corner.top-left,
    .scene-shell.is-zone-top-right .touch-corner.top-right,
    .scene-shell.is-zone-bottom-right .touch-corner.bottom-right,
    .scene-shell.is-zone-bottom-left .touch-corner.bottom-left,
    .scene-shell.is-zone-center .touch-center {
      opacity: 0.36;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
    }

    .scene-shell.is-zone-center .touch-center {
      transform: translate(-50%, -50%) scale(1.04);
    }

    @media (max-width: 640px) {
      .touch-corner {
        width: min(36vw, 36vh);
        height: min(36vw, 36vh);
      }

      .touch-center {
        width: min(38vw, 38vh);
        height: min(38vw, 38vh);
      }
    }

    @keyframes settle {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="scene-shell" id="sceneShell">
      <canvas
        id="scene"
        aria-label="Isometric Weliwel and Majisto walking scene. Use arrow keys, or tap the top-left, top-right, bottom-right, and bottom-left corners to move Weliwel. Tap the middle to trigger Weliwel's idle animation."
      ></canvas>
      <div class="touch-overlay" aria-hidden="true">
        <div class="touch-corner top-left"></div>
        <div class="touch-corner top-right"></div>
        <div class="touch-corner bottom-right"></div>
        <div class="touch-corner bottom-left"></div>
        <div class="touch-center"></div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const sceneShell = document.getElementById("sceneShell");
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      const scene = {
        width: 0,
        height: 0,
        dpr: window.devicePixelRatio || 1,
      };

      const grid = {
        width: 13,
        height: 13,
        tileWidth: 124,
        tileHeight: 64,
        tileDepth: 20,
      };

      const directions = {
        ArrowUp: { dx: 0, dy: -1, sprite: "ur", label: "Upper-right" },
        ArrowRight: { dx: 1, dy: 0, sprite: "lr", label: "Lower-right" },
        ArrowDown: { dx: 0, dy: 1, sprite: "ll", label: "Lower-left" },
        ArrowLeft: { dx: -1, dy: 0, sprite: "ul", label: "Upper-left" },
      };

      const idleSequence = ["Idle_1", "Idle_2", "Idle_3"];
      const idleCycleSequence = ["Idle_1", "Idle_2", "Idle_3", "Idle_2"];
      const walkingSequence = [
        "Idle_1",
        "Walking_1",
        "Walking_2",
        "Walking_3",
        "Idle_1",
        "Walking_4",
        "Walking_5",
        "Walking_6",
      ];

      const directionOrder = ["ArrowUp", "ArrowRight", "ArrowDown", "ArrowLeft"];
      const pressedControls = new Map();
      const pressedAt = new Map();
      const touchSource = "touch";
      const touchZoneClassNames = ["is-zone-top-left", "is-zone-top-right", "is-zone-bottom-right", "is-zone-bottom-left", "is-zone-center"];
      const touchZoneToDirectionKey = {
        "top-left": "ArrowLeft",
        "top-right": "ArrowUp",
        "bottom-right": "ArrowRight",
        "bottom-left": "ArrowDown",
      };
      const touchLayout = {
        cornerWidthRatio: 0.28,
        cornerHeightRatio: 0.28,
        centerRadiusRatio: 0.18,
        tapSlop: 18,
      };
      const activeTouchGesture = {
        pointerId: null,
        zone: null,
        key: null,
        mode: null,
        startX: 0,
        startY: 0,
      };

      const assets = {
        player: {},
        majisto: {},
        tree: {},
        flowers: {},
      };

      const debug = {
        showMarkers: false,
      };

      const trimConfig = {
        alphaThreshold: 1,
        paddingX: 20,
        paddingTop: 24,
        paddingBottom: 32,
        extraPaddingByType: {
          player: { x: 16, top: 28, bottom: 24 },
          tree: { x: 8, top: 6, bottom: 14 },
          flower: { x: 14, top: 12, bottom: 52 },
        },
        pivotYFactorByType: {
          player: 0.88,
          tree: 0.84,
          flower: 0.93,
        },
        pivotXFactorByType: {
          player: 0.5,
          tree: 0.5,
          flower: 0.5,
        },
        renderOffsetYByType: {
          player: 0,
          tree: 30,
          flower: 0,
        },
        matteAlphaCutoffByType: {
          default: 170,
          flower: 18,
        },
        matteRgbCutoff: 30,
      };

      const fallbackBounds = {
        player: { x: 220, y: 80, width: 640, height: 770, typeName: "player" },
        tree: { x: 190, y: 50, width: 700, height: 910, typeName: "tree" },
        flower: { x: 250, y: 250, width: 580, height: 520, typeName: "flower" },
      };

      const flowerSourceByDirection = {
        ur: { x: 370, y: 350, width: 381, height: 411 },
        ul: { x: 253, y: 438, width: 361, height: 371 },
        lr: { x: 466, y: 490, width: 361, height: 319 },
        ll: { x: 337, y: 552, width: 365, height: 319 },
      };

      const flowerPivotByDirection = {
        ur: { x: 539.39, y: 719.78 },
        ul: { x: 451.54, y: 781.97 },
        lr: { x: 627.52, y: 781.88 },
        ll: { x: 539.8, y: 844.04 },
      };

      const playerSourceByDirection = {
        ur: { x: 300, y: 0, width: 561, height: 816 },
        ul: { x: 35, y: 110, width: 745, height: 706 },
        lr: { x: 300, y: 150, width: 745, height: 725 },
        ll: { x: 219, y: 150, width: 561, height: 763 },
      };

      const playerPivotByDirection = {
        // Manual midpoint between both feet per direction (from idle reference poses).
        ur: { x: 605.56, y: 700.53 },
        ul: { x: 472.49, y: 700.51 },
        lr: { x: 563.4, y: 765.1 },
        ll: { x: 526.65, y: 773.58 },
      };

      const playerReferenceHeightByDirection = {
        ur: 792,
        ul: 663,
        lr: 686,
        ll: 724,
      };

      const majistoSourceByDirection = {
        // Union bounds across Majisto Idle_1/Idle_2/Idle_3 per direction (prevents idle frame clipping).
        ur: { x: 275, y: 0, width: 635, height: 788 },
        ul: { x: 13, y: 69, width: 792, height: 719 },
        lr: { x: 275, y: 109, width: 792, height: 741 },
        ll: { x: 170, y: 109, width: 635, height: 741 },
      };

      const majistoPivotByDirection = {
        // Manual center between both feet per direction (from Majisto idle reference poses).
        ur: { x: 640.1, y: 696.7 },
        ul: { x: 472.0, y: 697.0 },
        lr: { x: 557.5, y: 756.6 },
        ll: { x: 508.5, y: 766.1 },
      };

      const majistoReferenceHeightByDirection = {
        ur: 788,
        ul: 719,
        lr: 741,
        ll: 741,
      };

      const characterRenderProfiles = {
        player: {
          sourceByDirection: playerSourceByDirection,
          pivotByDirection: playerPivotByDirection,
          referenceHeightByDirection: playerReferenceHeightByDirection,
        },
        majisto: {
          sourceByDirection: majistoSourceByDirection,
          pivotByDirection: majistoPivotByDirection,
          referenceHeightByDirection: majistoReferenceHeightByDirection,
        },
      };

      const camera = {
        x: 0,
        y: 0,
      };

      const worldObjects = [
        { kind: "tree", label: "Mint tree", x: 3, y: 2, direction: "ur", solid: true, scale: 1.28, shadow: 0.92 },
        { kind: "tree", label: "Mint tree", x: 6, y: 2, direction: "ul", solid: true, scale: 1.28, shadow: 0.92 },
        { kind: "tree", label: "Mint tree", x: 9, y: 3, direction: "ll", solid: true, scale: 1.28, shadow: 0.92 },
        { kind: "tree", label: "Mint tree", x: 10, y: 6, direction: "lr", solid: true, scale: 1.28, shadow: 0.92 },
        { kind: "tree", label: "Mint tree", x: 5, y: 8, direction: "ur", solid: true, scale: 1.28, shadow: 0.92 },
        { kind: "tree", label: "Mint tree", x: 8, y: 10, direction: "ul", solid: true, scale: 1.28, shadow: 0.92 },
        { kind: "flower", flower: "redflower", label: "Red flowers", x: 2, y: 5, direction: "lr", solid: true, scale: 0.86, shadow: 0.56 },
        { kind: "flower", flower: "yellowflower", label: "Yellow flowers", x: 4, y: 6, direction: "ur", solid: true, scale: 0.86, shadow: 0.56 },
        { kind: "flower", flower: "whiteflower", label: "White flowers", x: 7, y: 5, direction: "ll", solid: true, scale: 0.86, shadow: 0.56 },
        { kind: "flower", flower: "redflower", label: "Red flowers", x: 11, y: 4, direction: "ul", solid: true, scale: 0.86, shadow: 0.56 },
        { kind: "flower", flower: "yellowflower", label: "Yellow flowers", x: 9, y: 8, direction: "lr", solid: true, scale: 0.86, shadow: 0.56 },
        { kind: "flower", flower: "whiteflower", label: "White flowers", x: 3, y: 10, direction: "ur", solid: true, scale: 0.86, shadow: 0.56 },
        { kind: "flower", flower: "redflower", label: "Red flowers", x: 6, y: 10, direction: "ll", solid: true, scale: 0.86, shadow: 0.56 },
        { kind: "flower", flower: "yellowflower", label: "Yellow flowers", x: 1, y: 8, direction: "ul", solid: true, scale: 0.86, shadow: 0.56 },
      ];

      const occupancy = new Map(worldObjects.map((object) => [tileKey(object.x, object.y), object]));

      const terrainPalette = ["#7ab26e", "#89bc78", "#6ea864", "#9ecf8a"];
      const tileTone = Array.from({ length: grid.height }, (_, y) =>
        Array.from({ length: grid.width }, (_, x) => terrainPalette[Math.abs(hashTile(x, y)) % terrainPalette.length])
      );

      function createCharacterState(x, y, direction) {
        return {
          x,
          y,
          renderX: x,
          renderY: y,
          fromX: x,
          fromY: y,
          toX: x,
          toY: y,
          moving: false,
          moveStartedAt: 0,
          moveDuration: 200,
          direction,
          animation: "idle",
          frameIndex: 0,
          frameTimer: 0,
          idleFrame: "Idle_1",
          idleCycleActive: false,
          idleCycleIndex: 0,
          idleCycleRunId: 0,
          nextIdleCycleAt: Number.POSITIVE_INFINITY,
          blockedUntil: 0,
        };
      }

      const player = createCharacterState(2, 9, "ur");
      const majisto = {
        ...createCharacterState(10, 9, "ll"),
        aiDirectionKey: null,
        aiDecisionAt: 0,
        aiWalkUntil: 0,
        lastRespondedPlayerIdleRunId: 0,
      };

      let isLoaded = false;
      let pendingIdleCycle = false;
      let previousFrameTime = 0;

      function hashTile(x, y) {
        return (x * 92837111) ^ (y * 689287499) ^ (x * y * 97);
      }

      function tileKey(x, y) {
        return `${x},${y}`;
      }

      function easeInOutSine(value) {
        return -(Math.cos(Math.PI * value) - 1) / 2;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function scheduleNextIdleCycle(character, now) {
        const wait = 9000 + Math.random() * 21000;
        character.nextIdleCycleAt = now + wait;
      }

      function pickRandomDirection(excludedDirectionKey = null) {
        const pool = excludedDirectionKey
          ? directionOrder.filter((key) => key !== excludedDirectionKey)
          : [...directionOrder];
        return pool[Math.floor(Math.random() * pool.length)];
      }

      function startCharacterIdleCycle(character, now) {
        if (character.animation !== "idle") {
          setCharacterAnimation(character, "idle", now);
        }
        character.idleCycleActive = true;
        character.idleCycleIndex = 0;
        character.frameTimer = 0;
        character.idleFrame = idleCycleSequence[0];
        character.idleCycleRunId += 1;
      }

      function areCharactersAdjacent(left, right) {
        return Math.abs(left.x - right.x) + Math.abs(left.y - right.y) === 1;
      }

      function getDirectionKeyToward(from, to) {
        const deltaX = to.x - from.x;
        const deltaY = to.y - from.y;
        return directionOrder.find((directionKey) => {
          const direction = directions[directionKey];
          return direction.dx === deltaX && direction.dy === deltaY;
        }) || null;
      }

      function toggleMarkerVisibility() {
        debug.showMarkers = !debug.showMarkers;
        render();
      }

      function triggerIdleCycle(now) {
        if (player.moving) {
          pendingIdleCycle = true;
          return false;
        }
        pendingIdleCycle = false;
        setAnimation("idle", now);
        startCharacterIdleCycle(player, now);
        return true;
      }

      function resizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        scene.width = bounds.width;
        scene.height = bounds.height;
        scene.dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(bounds.width * scene.dpr);
        canvas.height = Math.round(bounds.height * scene.dpr);
        ctx.setTransform(scene.dpr, 0, 0, scene.dpr, 0, 0);
        ctx.imageSmoothingEnabled = true;
      }

      function activateControl(key, source) {
        const sources = pressedControls.get(key) || new Set();
        sources.add(source);
        pressedControls.set(key, sources);
        pressedAt.set(key, performance.now());
      }

      function deactivateControl(key, source) {
        const sources = pressedControls.get(key);
        if (!sources) {
          return;
        }
        sources.delete(source);
        if (!sources.size) {
          pressedControls.delete(key);
        }
      }

      function isPressed(key) {
        return pressedControls.has(key);
      }

      function getActiveDirectionKey() {
        let bestKey = null;
        let bestTime = -Infinity;
        for (const key of directionOrder) {
          if (isPressed(key) && (pressedAt.get(key) || 0) >= bestTime) {
            bestKey = key;
            bestTime = pressedAt.get(key) || 0;
          }
        }
        return bestKey;
      }

      function setActiveTouchZone(zone) {
        sceneShell.classList.remove(...touchZoneClassNames);
        if (zone) {
          sceneShell.classList.add(`is-zone-${zone}`);
        }
      }

      function clearTouchGesture(releaseControl = true) {
        if (releaseControl && activeTouchGesture.key) {
          deactivateControl(activeTouchGesture.key, touchSource);
        }
        activeTouchGesture.pointerId = null;
        activeTouchGesture.zone = null;
        activeTouchGesture.key = null;
        activeTouchGesture.mode = null;
        activeTouchGesture.startX = 0;
        activeTouchGesture.startY = 0;
        setActiveTouchZone(null);
      }

      function getTouchZone(clientX, clientY) {
        const bounds = sceneShell.getBoundingClientRect();
        const localX = clientX - bounds.left;
        const localY = clientY - bounds.top;
        if (localX < 0 || localY < 0 || localX > bounds.width || localY > bounds.height) {
          return null;
        }

        const cornerWidth = bounds.width * touchLayout.cornerWidthRatio;
        const cornerHeight = bounds.height * touchLayout.cornerHeightRatio;
        const centerDistance = Math.hypot(localX - bounds.width * 0.5, localY - bounds.height * 0.5);
        if (centerDistance <= Math.min(bounds.width, bounds.height) * touchLayout.centerRadiusRatio) {
          return "center";
        }
        if (localX <= cornerWidth && localY <= cornerHeight) {
          return "top-left";
        }
        if (localX >= bounds.width - cornerWidth && localY <= cornerHeight) {
          return "top-right";
        }
        if (localX >= bounds.width - cornerWidth && localY >= bounds.height - cornerHeight) {
          return "bottom-right";
        }
        if (localX <= cornerWidth && localY >= bounds.height - cornerHeight) {
          return "bottom-left";
        }
        return null;
      }

      function startTouchMove(directionKey, now) {
        activateControl(directionKey, touchSource);
        if (!player.moving) {
          tryStartMove(directionKey, now);
        }
      }

      function projectMap(gridX, gridY) {
        const mapX = (gridX - gridY) * grid.tileWidth * 0.5;
        const mapY = (gridX + gridY) * grid.tileHeight * 0.5;
        return { x: mapX, y: mapY };
      }

      function screenProject(gridX, gridY) {
        const position = projectMap(gridX, gridY);
        return {
          x: position.x + scene.width * 0.5 + camera.x,
          y: position.y + scene.height * 0.28 + camera.y,
        };
      }

      function worldSortValue(entity) {
        const characterDepthBias = entity.kind === "player" || entity.kind === "majisto" ? 0.06 : 0.02;
        return entity.y + entity.x + characterDepthBias;
      }

      function makeManifest() {
        const manifest = [];
        const directionsList = ["ur", "ul", "lr", "ll"];
        const playerFrames = Array.from(new Set([...idleSequence, ...walkingSequence]));
        const characters = [
          { kind: "player", prefix: "Weliwel" },
          { kind: "majisto", prefix: "Majisto" },
        ];

        for (const direction of directionsList) {
          for (const character of characters) {
            for (const frame of playerFrames) {
              manifest.push({
                kind: character.kind,
                direction,
                frame,
                type: "player",
                src: `Weliwel_Sprites/${character.prefix}_${frame}_${direction}.png`,
              });
            }
          }

          manifest.push({
            kind: "tree",
            direction,
            type: "tree",
            src: `Weliwel_Sprites/tree_${direction}.png`,
          });

          for (const flower of ["redflower", "whiteflower", "yellowflower"]) {
            manifest.push({
              kind: "flower",
              flower,
              direction,
              type: "flower",
              src: `Weliwel_Sprites/${flower}_${direction}.png`,
            });
          }
        }

        return manifest;
      }

      function isMatteCandidate(alpha, r, g, b, typeName = "default") {
        const alphaCutoff = trimConfig.matteAlphaCutoffByType[typeName] ?? trimConfig.matteAlphaCutoffByType.default;
        return (
          alpha < alphaCutoff &&
          r <= trimConfig.matteRgbCutoff &&
          g <= trimConfig.matteRgbCutoff &&
          b <= trimConfig.matteRgbCutoff
        );
      }

      function computeSpriteMetrics(image, fallback) {
        try {
          const typeName = fallback.typeName || "default";
          const probe = document.createElement("canvas");
          probe.width = image.naturalWidth;
          probe.height = image.naturalHeight;
          const probeCtx = probe.getContext("2d", { willReadFrequently: true });
          probeCtx.drawImage(image, 0, 0);
          const pixels = probeCtx.getImageData(0, 0, probe.width, probe.height).data;
          let minX = probe.width;
          let minY = probe.height;
          let maxX = 0;
          let maxY = 0;
          let found = false;

          for (let y = 0; y < probe.height; y += 1) {
            for (let x = 0; x < probe.width; x += 1) {
              const index = (y * probe.width + x) * 4;
              const r = pixels[index];
              const g = pixels[index + 1];
              const b = pixels[index + 2];
              const alpha = pixels[index + 3];
              const isRenderable = alpha >= trimConfig.alphaThreshold && !isMatteCandidate(alpha, r, g, b, typeName);
              if (isRenderable) {
                found = true;
                if (x < minX) minX = x;
                if (y < minY) minY = y;
                if (x > maxX) maxX = x;
                if (y > maxY) maxY = y;
              }
            }
          }

          if (!found) {
            return {
              bounds: fallback,
              pivot: {
                x: fallback.x + fallback.width * 0.5,
                y: fallback.y + fallback.height,
              },
              referenceHeight: fallback.height,
            };
          }

          const rawMinY = minY;
          const rawMinX = minX;
          const rawMaxX = maxX;
          const rawMaxY = maxY;
          const rawBounds = {
            x: rawMinX,
            y: rawMinY,
            width: rawMaxX - rawMinX + 1,
            height: rawMaxY - rawMinY + 1,
          };

          const extra = trimConfig.extraPaddingByType[typeName] || { x: 0, top: 0, bottom: 0 };
          minX = Math.max(0, minX - trimConfig.paddingX - extra.x);
          minY = Math.max(0, minY - trimConfig.paddingTop - extra.top);
          maxX = Math.min(probe.width - 1, maxX + trimConfig.paddingX + extra.x);
          maxY = Math.min(probe.height - 1, maxY + trimConfig.paddingBottom + extra.bottom);

          const bounds = {
            x: minX,
            y: minY,
            width: maxX - minX + 1,
            height: maxY - minY + 1,
          };

          let pivotX = bounds.x + bounds.width * (trimConfig.pivotXFactorByType[typeName] ?? 0.5);
          let pivotY = bounds.y + bounds.height * (trimConfig.pivotYFactorByType[typeName] ?? 0.9);
          let referenceHeight = bounds.height;

          if (typeName === "flower") {
            // Guarantee full flower rendering: use the entire source image as draw bounds.
            bounds.x = 0;
            bounds.y = 0;
            bounds.width = probe.width;
            bounds.height = probe.height;
            referenceHeight = rawBounds.height;

            // Anchor flowers from the lowest visible base pixels.
            const searchStartY = Math.max(rawMinY, rawMaxY - 20);
            let sumX = 0;
            let sumY = 0;
            let count = 0;
            for (let y = searchStartY; y <= rawMaxY; y += 1) {
              for (let x = rawMinX; x <= rawMaxX; x += 1) {
                const index = (y * probe.width + x) * 4;
                const r = pixels[index];
                const g = pixels[index + 1];
                const b = pixels[index + 2];
                const alpha = pixels[index + 3];
                const isRenderable = alpha >= trimConfig.alphaThreshold && !isMatteCandidate(alpha, r, g, b, typeName);
                const isBasePixel = isRenderable && (g >= r + 6 || alpha >= 42);
                if (isBasePixel) {
                  sumX += x;
                  sumY += y;
                  count += 1;
                }
              }
            }

            if (count > 8) {
              pivotX = sumX / count;
              pivotY = sumY / count;
            } else {
              pivotX = rawBounds.x + rawBounds.width * 0.5;
              pivotY = rawBounds.y + rawBounds.height;
            }
          }

          return {
            bounds,
            pivot: {
              x: pivotX,
              y: pivotY,
            },
            referenceHeight,
          };
        } catch (error) {
          return {
            bounds: fallback,
            pivot: {
              x: fallback.x + fallback.width * 0.5,
              y: fallback.y + fallback.height,
            },
            referenceHeight: fallback.height,
          };
        }
      }

      function loadSprite(entry) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => {
            const fallback = fallbackBounds[entry.type];
            let metrics = computeSpriteMetrics(image, fallback);

            if (entry.kind === "player" || entry.kind === "majisto") {
              const profile = characterRenderProfiles[entry.kind];
              const source = profile?.sourceByDirection?.[entry.direction];
              const pivot = profile?.pivotByDirection?.[entry.direction];
              const referenceHeight = profile?.referenceHeightByDirection?.[entry.direction];
              if (source && pivot && referenceHeight) {
                metrics = {
                  bounds: source,
                  pivot,
                  referenceHeight,
                };
              }
            }

            if (entry.kind === "flower") {
              const source = flowerSourceByDirection[entry.direction];
              const pivot = flowerPivotByDirection[entry.direction];
              if (source && pivot) {
                metrics = {
                  bounds: source,
                  pivot,
                  referenceHeight: source.height,
                };
              }
            }
            resolve({
              ...entry,
              image,
              bounds: metrics.bounds,
              pivot: metrics.pivot,
              referenceHeight: metrics.referenceHeight,
            });
          };
          image.onerror = () => reject(new Error(`Could not load ${entry.src}`));
          image.src = entry.src;
        });
      }

      async function preloadAssets() {
        const manifest = makeManifest();
        const loaded = await Promise.all(manifest.map(loadSprite));

        for (const sprite of loaded) {
          if (sprite.kind === "player" || sprite.kind === "majisto") {
            assets[sprite.kind][sprite.direction] ||= {};
            assets[sprite.kind][sprite.direction][sprite.frame] = sprite;
            continue;
          }

          if (sprite.kind === "tree") {
            assets.tree[sprite.direction] = sprite;
            continue;
          }

          assets.flowers[sprite.flower] ||= {};
          assets.flowers[sprite.flower][sprite.direction] = sprite;
        }
      }

      function getCurrentCharacterFrame(character) {
        if (character.animation === "walking") {
          return walkingSequence[character.frameIndex % walkingSequence.length];
        }
        return character.idleFrame;
      }

      function getCurrentPlayerFrame() {
        return getCurrentCharacterFrame(player);
      }

      function getCurrentMajistoFrame() {
        return getCurrentCharacterFrame(majisto);
      }

      function setCharacterAnimation(character, animation, now) {
        if (character.animation === animation) {
          return;
        }
        character.animation = animation;
        character.frameIndex = 0;
        character.frameTimer = 0;
        if (animation === "walking") {
          character.idleFrame = "Idle_1";
          character.idleCycleActive = false;
          return;
        }
        character.idleFrame = "Idle_1";
        character.idleCycleActive = false;
        character.idleCycleIndex = 0;
        scheduleNextIdleCycle(character, now ?? performance.now());
      }

      function setAnimation(animation, now) {
        setCharacterAnimation(player, animation, now);
      }

      function setMajistoAnimation(animation, now) {
        setCharacterAnimation(majisto, animation, now);
      }

      function stepCharacterAnimation(character, deltaMs, now) {
        if (character.animation === "walking") {
          const duration = 86;
          character.frameTimer += deltaMs;

          while (character.frameTimer >= duration) {
            character.frameTimer -= duration;
            character.frameIndex += 1;
            if (character.frameIndex >= walkingSequence.length) {
              character.frameIndex = 0;
            }
          }
          return;
        }

        if (!character.idleCycleActive) {
          character.idleFrame = "Idle_1";
          if (now >= character.nextIdleCycleAt) {
            startCharacterIdleCycle(character, now);
          }
          return;
        }

        const duration = 230;
        character.frameTimer += deltaMs;
        while (character.frameTimer >= duration) {
          character.frameTimer -= duration;
          character.idleCycleIndex += 1;
          if (character.idleCycleIndex >= idleCycleSequence.length) {
            character.idleCycleActive = false;
            character.idleCycleIndex = 0;
            character.idleFrame = "Idle_1";
            scheduleNextIdleCycle(character, now);
            return;
          }
          character.idleFrame = idleCycleSequence[character.idleCycleIndex];
        }
      }

      function stepAnimation(deltaMs, now) {
        stepCharacterAnimation(player, deltaMs, now);
      }

      function stepMajistoAnimation(deltaMs, now) {
        stepCharacterAnimation(majisto, deltaMs, now);
      }

      function getBlockingCharacterAt(nextX, nextY, movingCharacter) {
        if (movingCharacter !== player && player.x === nextX && player.y === nextY) {
          return { state: player, label: "Weliwel" };
        }
        if (movingCharacter !== majisto && majisto.x === nextX && majisto.y === nextY) {
          return { state: majisto, label: "Majisto" };
        }
        return null;
      }

      function tryStartCharacterMove(character, directionKey, now) {
        const direction = directions[directionKey];
        if (!direction) {
          return { moved: false };
        }

        character.direction = direction.sprite;
        const nextX = character.x + direction.dx;
        const nextY = character.y + direction.dy;
        const outOfBounds = nextX < 0 || nextY < 0 || nextX >= grid.width || nextY >= grid.height;
        const targetKey = tileKey(nextX, nextY);
        const blockingObject = outOfBounds ? null : occupancy.get(targetKey);
        const blockingCharacter = outOfBounds ? null : getBlockingCharacterAt(nextX, nextY, character);

        if (outOfBounds || blockingObject || blockingCharacter) {
          return {
            moved: false,
            nextX,
            nextY,
            outOfBounds,
            blockingObject,
            blockingCharacter,
          };
        }

        character.fromX = character.renderX;
        character.fromY = character.renderY;
        character.toX = nextX;
        character.toY = nextY;
        character.x = nextX;
        character.y = nextY;
        character.moveStartedAt = now;
        character.moving = true;
        setCharacterAnimation(character, "walking", now);
        return {
          moved: true,
          nextX,
          nextY,
        };
      }

      function tryStartMove(directionKey, now) {
        const result = tryStartCharacterMove(player, directionKey, now);
        if (!result.moved) {
          player.blockedUntil = now + 520;
          setAnimation("idle", now);
          return false;
        }
        return true;
      }

      function tryStartMajistoMove(directionKey, now) {
        const result = tryStartCharacterMove(majisto, directionKey, now);
        if (!result.moved) {
          majisto.blockedUntil = now + 420;
          setMajistoAnimation("idle", now);
          return false;
        }
        return true;
      }

      function updateMovement(now) {
        const activeDirection = getActiveDirectionKey();

        if (!player.moving) {
          player.renderX = player.x;
          player.renderY = player.y;
          if (activeDirection) {
            tryStartMove(activeDirection, now);
          } else {
            if (pendingIdleCycle) {
              triggerIdleCycle(now);
              return;
            }
            setAnimation("idle", now);
            if (player.blockedUntil && now > player.blockedUntil) {
              player.blockedUntil = 0;
            }
          }
          return;
        }

        const elapsed = now - player.moveStartedAt;
        const progress = clamp(elapsed / player.moveDuration, 0, 1);
        const eased = easeInOutSine(progress);
        player.renderX = player.fromX + (player.toX - player.fromX) * eased;
        player.renderY = player.fromY + (player.toY - player.fromY) * eased;

        if (progress >= 1) {
          player.moving = false;
          player.renderX = player.toX;
          player.renderY = player.toY;

          if (!(activeDirection && tryStartMove(activeDirection, now))) {
            if (pendingIdleCycle) {
              triggerIdleCycle(now);
            } else {
              setAnimation("idle", now);
            }
          }
        }
      }

      function scheduleMajistoIdle(now, minDelay = 900, maxDelay = 2800) {
        majisto.aiDirectionKey = null;
        majisto.aiWalkUntil = 0;
        majisto.aiDecisionAt = now + randomBetween(minDelay, maxDelay);
        setMajistoAnimation("idle", now);
      }

      function scheduleMajistoWalk(now, directionKey = null) {
        majisto.aiDirectionKey = directionKey || pickRandomDirection();
        majisto.aiWalkUntil = now + randomBetween(1100, 3600);
        if (majisto.aiDecisionAt < now) {
          majisto.aiDecisionAt = now;
        }
      }

      function maybeMajistoRespondToWeliwelIdle(now) {
        if (majisto.moving || !player.idleCycleActive) {
          return false;
        }
        if (player.idleCycleRunId <= 0 || majisto.lastRespondedPlayerIdleRunId === player.idleCycleRunId) {
          return false;
        }
        if (!areCharactersAdjacent(majisto, player)) {
          return false;
        }

        const lookDirectionKey = getDirectionKeyToward(majisto, player);
        if (lookDirectionKey) {
          majisto.direction = directions[lookDirectionKey].sprite;
        }
        majisto.aiDirectionKey = null;
        majisto.aiWalkUntil = 0;
        majisto.aiDecisionAt = now + randomBetween(1400, 3400);
        majisto.lastRespondedPlayerIdleRunId = player.idleCycleRunId;
        startCharacterIdleCycle(majisto, now);
        return true;
      }

      function maybePickMajistoBehavior(now) {
        if (majisto.aiDirectionKey || now < majisto.aiDecisionAt) {
          return;
        }
        if (Math.random() < 0.45) {
          scheduleMajistoIdle(now, 1300, 5400);
          return;
        }
        scheduleMajistoWalk(now);
      }

      function attemptMajistoMove(now, maxAttempts = 3) {
        for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
          if (!majisto.aiDirectionKey) {
            return false;
          }
          if (tryStartMajistoMove(majisto.aiDirectionKey, now)) {
            return true;
          }
          if (Math.random() < 0.5) {
            scheduleMajistoIdle(now, 700, 1900);
            return false;
          }
          scheduleMajistoWalk(now, pickRandomDirection(majisto.aiDirectionKey));
        }
        scheduleMajistoIdle(now, 700, 1700);
        return false;
      }

      function updateMajistoMovement(now) {
        if (!majisto.moving) {
          majisto.renderX = majisto.x;
          majisto.renderY = majisto.y;

          if (maybeMajistoRespondToWeliwelIdle(now)) {
            return;
          }

          if (majisto.aiDirectionKey && now >= majisto.aiWalkUntil) {
            if (Math.random() < 0.5) {
              scheduleMajistoIdle(now, 900, 2600);
              return;
            }
            scheduleMajistoWalk(now, pickRandomDirection(majisto.aiDirectionKey));
          }

          maybePickMajistoBehavior(now);

          if (!majisto.aiDirectionKey) {
            setMajistoAnimation("idle", now);
            return;
          }

          if (!attemptMajistoMove(now, 3)) {
            setMajistoAnimation("idle", now);
          }
          return;
        }

        const elapsed = now - majisto.moveStartedAt;
        const progress = clamp(elapsed / majisto.moveDuration, 0, 1);
        const eased = easeInOutSine(progress);
        majisto.renderX = majisto.fromX + (majisto.toX - majisto.fromX) * eased;
        majisto.renderY = majisto.fromY + (majisto.toY - majisto.fromY) * eased;

        if (progress >= 1) {
          majisto.moving = false;
          majisto.renderX = majisto.toX;
          majisto.renderY = majisto.toY;

          if (!majisto.aiDirectionKey || now >= majisto.aiWalkUntil) {
            if (Math.random() < 0.55) {
              scheduleMajistoIdle(now, 850, 2600);
              return;
            }
            scheduleMajistoWalk(now, pickRandomDirection(majisto.aiDirectionKey));
          }

          if (!attemptMajistoMove(now, 2)) {
            setMajistoAnimation("idle", now);
          }
        }
      }

      function updateCamera() {
        const anchor = projectMap(player.renderX, player.renderY);
        const targetX = -anchor.x;
        const targetY = scene.height * 0.22 - anchor.y;
        camera.x += (targetX - camera.x) * 0.12;
        camera.y += (targetY - camera.y) * 0.12;
      }

      function getMarkerRadius(entityKind) {
        if (entityKind === "player" || entityKind === "majisto") {
          return { x: 17, y: 8, alpha: 0.17 };
        }
        if (entityKind === "tree") {
          return { x: 18, y: 9, alpha: 0.14 };
        }
        return { x: 12, y: 6, alpha: 0.14 };
      }

      function drawBackground() {
        ctx.clearRect(0, 0, scene.width, scene.height);

        const sky = ctx.createLinearGradient(0, 0, 0, scene.height);
        sky.addColorStop(0, "#d9f7ef");
        sky.addColorStop(0.56, "#9fd5a5");
        sky.addColorStop(1, "#5a9464");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, scene.width, scene.height);

        ctx.fillStyle = "rgba(255, 249, 214, 0.5)";
        ctx.beginPath();
        ctx.arc(scene.width * 0.12, scene.height * 0.12, 66, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255, 255, 255, 0.16)";
        ctx.beginPath();
        ctx.ellipse(scene.width * 0.22, scene.height * 0.15, 110, 28, 0.1, 0, Math.PI * 2);
        ctx.ellipse(scene.width * 0.52, scene.height * 0.2, 140, 32, -0.04, 0, Math.PI * 2);
        ctx.ellipse(scene.width * 0.74, scene.height * 0.12, 90, 24, 0.02, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawTile(centerX, centerY, fill) {
        const halfW = grid.tileWidth * 0.5;
        const halfH = grid.tileHeight * 0.5;
        const depth = grid.tileDepth;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY - halfH);
        ctx.lineTo(centerX + halfW, centerY);
        ctx.lineTo(centerX, centerY + halfH);
        ctx.lineTo(centerX - halfW, centerY);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(centerX - halfW, centerY);
        ctx.lineTo(centerX, centerY + halfH);
        ctx.lineTo(centerX, centerY + halfH + depth);
        ctx.lineTo(centerX - halfW, centerY + depth);
        ctx.closePath();
        ctx.fillStyle = shade(fill, -18);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(centerX + halfW, centerY);
        ctx.lineTo(centerX, centerY + halfH);
        ctx.lineTo(centerX, centerY + halfH + depth);
        ctx.lineTo(centerX + halfW, centerY + depth);
        ctx.closePath();
        ctx.fillStyle = shade(fill, -28);
        ctx.fill();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY - halfH);
        ctx.lineTo(centerX + halfW, centerY);
        ctx.lineTo(centerX, centerY + halfH);
        ctx.lineTo(centerX - halfW, centerY);
        ctx.closePath();
        ctx.stroke();
      }

      function shade(hex, amount) {
        const value = hex.replace("#", "");
        const number = Number.parseInt(value, 16);
        const r = clamp(((number >> 16) & 255) + amount, 0, 255);
        const g = clamp(((number >> 8) & 255) + amount, 0, 255);
        const b = clamp((number & 255) + amount, 0, 255);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function drawGround() {
        ctx.save();
        ctx.shadowColor = "rgba(11, 25, 17, 0.22)";
        ctx.shadowBlur = 22;
        ctx.shadowOffsetY = 18;
        for (let y = 0; y < grid.height; y += 1) {
          for (let x = 0; x < grid.width; x += 1) {
            const position = screenProject(x, y);
            drawTile(position.x, position.y, tileTone[y][x]);
          }
        }
        ctx.restore();
      }

      function drawLocationMarker(anchorX, anchorY, radiusX, radiusY, alpha) {
        ctx.fillStyle = `rgba(7, 18, 13, ${alpha})`;
        ctx.beginPath();
        ctx.ellipse(anchorX, anchorY, radiusX, radiusY, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawSprite(sprite, anchorX, anchorY, targetHeight) {
        const source = sprite.bounds;
        const referenceHeight = sprite.referenceHeight || source.height;
        const scale = targetHeight / referenceHeight;
        const targetWidth = source.width * scale;
        const pivotX = (sprite.pivot?.x ?? source.x + source.width * 0.5) - source.x;
        const pivotY = (sprite.pivot?.y ?? source.y + source.height) - source.y;
        ctx.drawImage(
          sprite.image,
          source.x,
          source.y,
          source.width,
          source.height,
          anchorX - pivotX * scale,
          anchorY - pivotY * scale,
          targetWidth,
          targetHeight
        );
      }

      function drawEntities() {
        const entities = [
          ...worldObjects.map((object) => ({
            kind: object.kind,
            x: object.x,
            y: object.y,
            object,
          })),
          {
            kind: "player",
            x: player.renderX,
            y: player.renderY,
          },
          {
            kind: "majisto",
            x: majisto.renderX,
            y: majisto.renderY,
          },
        ].sort((left, right) => worldSortValue(left) - worldSortValue(right));

        for (const entity of entities) {
          const position = screenProject(entity.x, entity.y);
          const anchorX = position.x;
          const anchorY = position.y + grid.tileHeight * 0.18;

          if (entity.kind === "player" || entity.kind === "majisto") {
            const isWeliwel = entity.kind === "player";
            const character = isWeliwel ? player : majisto;
            const characterAssets = isWeliwel ? assets.player : assets.majisto;
            const frame = isWeliwel ? getCurrentPlayerFrame() : getCurrentMajistoFrame();
            const sprite = characterAssets[character.direction]?.[frame];
            if (!sprite) {
              continue;
            }
            if (debug.showMarkers) {
              const marker = getMarkerRadius(entity.kind);
              drawLocationMarker(anchorX, anchorY, marker.x, marker.y, marker.alpha);
            }
            drawSprite(sprite, anchorX, anchorY, 180);
            continue;
          }

          const object = entity.object;
          const sprite =
            object.kind === "tree"
              ? assets.tree[object.direction]
              : assets.flowers[object.flower]?.[object.direction];

          if (!sprite) {
            continue;
          }

          if (debug.showMarkers) {
            const marker = getMarkerRadius(object.kind);
            drawLocationMarker(anchorX, anchorY, marker.x, marker.y, marker.alpha);
          }
          const baseHeight = object.kind === "tree" ? 192 : 108;
          const renderOffsetY = trimConfig.renderOffsetYByType[object.kind] || 0;
          drawSprite(sprite, anchorX, anchorY + renderOffsetY, baseHeight * object.scale);
        }
      }

      function render() {
        drawBackground();
        ctx.save();
        drawGround();
        drawEntities();
        ctx.restore();
      }

      function loop(now) {
        const delta = previousFrameTime ? now - previousFrameTime : 16;
        previousFrameTime = now;

        if (isLoaded) {
          updateMovement(now);
          updateMajistoMovement(now);
          updateCamera();
          stepAnimation(delta, now);
          stepMajistoAnimation(delta, now);
          render();
        } else {
          render();
        }

        requestAnimationFrame(loop);
      }

      function wireKeyboard() {
        window.addEventListener("keydown", (event) => {
          if (event.code === "KeyC" && !event.repeat) {
            event.preventDefault();
            toggleMarkerVisibility();
            return;
          }

          if (event.code === "KeyI" && !event.repeat) {
            event.preventDefault();
            triggerIdleCycle(performance.now());
            return;
          }

          if (!(event.key in directions)) {
            return;
          }
          event.preventDefault();
          activateControl(event.key, "keyboard");
        });

        window.addEventListener("keyup", (event) => {
          if (!(event.key in directions)) {
            return;
          }
          event.preventDefault();
          deactivateControl(event.key, "keyboard");
        });

        window.addEventListener("blur", () => {
          directionOrder.forEach((key) => deactivateControl(key, "keyboard"));
          directionOrder.forEach((key) => deactivateControl(key, touchSource));
          clearTouchGesture(false);
        });
      }

      function wireTouchControls() {
        sceneShell.addEventListener("pointerdown", (event) => {
          if (!event.isPrimary) {
            return;
          }
          if (event.pointerType === "mouse" && event.button !== 0) {
            return;
          }
          if (activeTouchGesture.pointerId !== null) {
            return;
          }

          const zone = getTouchZone(event.clientX, event.clientY);
          if (!zone) {
            return;
          }

          event.preventDefault();
          sceneShell.setPointerCapture(event.pointerId);
          activeTouchGesture.pointerId = event.pointerId;
          activeTouchGesture.zone = zone;
          activeTouchGesture.key = touchZoneToDirectionKey[zone] || null;
          activeTouchGesture.mode = activeTouchGesture.key ? "move" : "idle";
          activeTouchGesture.startX = event.clientX;
          activeTouchGesture.startY = event.clientY;
          setActiveTouchZone(zone);

          if (activeTouchGesture.key) {
            startTouchMove(activeTouchGesture.key, performance.now());
          }
        });

        sceneShell.addEventListener("pointerup", (event) => {
          if (event.pointerId !== activeTouchGesture.pointerId) {
            return;
          }

          event.preventDefault();
          const movement = Math.hypot(event.clientX - activeTouchGesture.startX, event.clientY - activeTouchGesture.startY);
          const shouldTriggerIdle = activeTouchGesture.mode === "idle" && movement <= touchLayout.tapSlop;
          clearTouchGesture();
          if (shouldTriggerIdle) {
            triggerIdleCycle(performance.now());
          }
        });

        sceneShell.addEventListener("pointercancel", (event) => {
          if (event.pointerId !== activeTouchGesture.pointerId) {
            return;
          }

          event.preventDefault();
          clearTouchGesture();
        });

        sceneShell.addEventListener("lostpointercapture", () => {
          if (activeTouchGesture.pointerId !== null) {
            clearTouchGesture();
          }
        });
      }

      async function boot() {
        resizeCanvas();
        render();
        wireKeyboard();
        wireTouchControls();

        try {
          await preloadAssets();
          isLoaded = true;
          player.idleFrame = "Idle_1";
          majisto.idleFrame = "Idle_1";
          const now = performance.now();
          scheduleNextIdleCycle(player, now);
          scheduleNextIdleCycle(majisto, now);
          majisto.aiDecisionAt = now + randomBetween(500, 1400);
          majisto.aiDirectionKey = null;
          majisto.aiWalkUntil = 0;
        } catch (error) {
          console.error(error);
        }
      }

      window.addEventListener("resize", () => {
        resizeCanvas();
        render();
      });

      requestAnimationFrame(loop);
      boot();
    })();
  </script>
</body>
</html>
